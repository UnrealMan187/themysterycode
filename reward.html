<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Belohnung – The Mystery Code</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/image/logo/favicon.png" />
    <link rel="stylesheet" href="css/reward.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page page--dark">
    <main class="container">
      <section class="card card--glow reward-card">
        <h1 class="headline">Deine digitale Belohnung</h1>
        <p class="lead">Wir bereiten deinen Download vor. Klicke auf „Jetzt herunterladen“.</p>

        <!-- Wir übergeben den PDF-Pfad per data-Attribut (wartbar ohne JS-Änderung) -->
        <div id="reward" data-pdf="/downloads/tmc-digital.pdf">
          <button id="btnDownload" class="btn btn--gold btn--lg">⬇️ Jetzt herunterladen</button>
          <p id="state" class="hint">Sicherer Download über unsere Server …</p>

          <!-- Fallback-Link, falls fetch scheitert -->
          <p id="fallback" class="hint is-hidden">
            Falls nichts passiert, <a id="fallbackLink" href="#" download>klicke hier</a>.
          </p>
        </div>
      </section>
    </main>

    <script src="/js/reward.js"></script>
  </body>
</html>
