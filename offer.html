    <meta charset="UTF-8" />

    />
    <link rel="canonical" href="https://themysterycode.de/offer.html" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="The Mystery Code – Das Erlebnis" />
    <meta
      property="og:description"
      content="Scanne. Entscheide. Erlebe. Ein zufälliger Reward – digital oder physisch – kuratiert mit Stil."
    />
    <meta property="og:image" content="https://themysterycode.de/image/social/offer-share.jpg" />
    <meta property="og:url" content="https://themysterycode.de/offer.html" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Mystery Code – Das Erlebnis" />
    <meta
      name="twitter:description"
      content="Scanne. Entscheide. Erlebe. Ein zufälliger Reward – digital oder physisch – kuratiert mit Stil."

    <!-- Assets -->
    <link rel="icon" href="image/logo/favicon.png" />
    <link rel="stylesheet" href="styles.css" />

    <!-- Performance: BG vorladen -->
    <link rel="preload" as="image" href="image/img/background.png" imagesrcset />

    <!-- Nur Upgrade, keine strenge CSP, damit PayPal-SDK nicht blockiert wird -->
    <meta
      http-equiv="Content-Security-Policy"
      content="upgrade-insecure-requests; block-all-mixed-content"
    />
  </head>
  <body>
    <!-- HERO -->
    <header class="hero" role="banner" aria-label="The Mystery Code – Hero">
      <canvas class="fx-canvas" aria-hidden="true"></canvas>

      <div class="hero__inner">
        <h1 class="celebrate__title">Glückwunsch, Du hast den Code gefunden!</h1>
        <p class="hero__subtitle">Scanne. Entscheide. Erlebe.</p>

        <!-- Countdown -->
        <section id="code-timer" class="countdown" aria-live="polite" aria-label="Code-Timer">
          <div class="countdown__dial">
            <svg class="dial" viewBox="0 0 160 160" role="img" aria-label="Countdown 12 Stunden">
              <circle class="dial__bg" cx="80" cy="80" r="70"></circle>
              <circle class="dial__progress" cx="80" cy="80" r="62"></circle>
              <g class="ticks--major" aria-hidden="true">
                <line x1="80" y1="6" x2="80" y2="16" />
                <line x1="80" y1="144" x2="80" y2="154" />
                <line x1="6" y1="80" x2="16" y2="80" />
                <line x1="144" y1="80" x2="154" y2="80" />
                <line x1="80" y1="6" x2="80" y2="16" transform="rotate(30 80 80)" />
                <line x1="80" y1="6" x2="80" y2="16" transform="rotate(60 80 80)" />
                <line x1="80" y1="6" x2="80" y2="16" transform="rotate(120 80 80)" />
                <line x1="80" y1="6" x2="80" y2="16" transform="rotate(150 80 80)" />
                <line x1="80" y1="144" x2="80" y2="154" transform="rotate(30 80 80)" />
                <line x1="80" y1="144" x2="80" y2="154" transform="rotate(60 80 80)" />
                <line x1="80" y1="144" x2="80" y2="154" transform="rotate(120 80 80)" />
                <line x1="80" y1="144" x2="80" y2="154" transform="rotate(150 80 80)" />
              </g>
              <g class="ticks--minor" aria-hidden="true"></g>
              <g class="needle-group" filter="url(#glow)" aria-hidden="true">
                <line id="tmc-needle" x1="80" y1="80" x2="80" y2="18" class="needle" />
                <circle cx="80" cy="80" r="3.6" class="needle-cap" />
              </g>
              <defs>
                <filter id="glow">
                  <feGaussianBlur stdDeviation="1.8" result="coloredBlur" />
                  <feMerge>
                    <feMergeNode in="coloredBlur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>
            </svg>
            <div class="countdown__readout" aria-hidden="true">
              <div class="readout__digits" id="tmc-digits">12:00:00</div>
            </div>
          </div>
        </section>

        <nav class="hero__cta" aria-label="Seiten-Navigation">
          <a class="btn btn--primary btn--lg" href="#offer">Was Dich erwartet</a>
          <a class="btn btn--ghost btn--lg" href="#how">Zum Ablauf</a>
        </nav>

        <div style="margin-top: 120px">
          <a
            class="btn btn--primary btn--lg"
            href="https://buymeacoffee.com/themysterycode/e/472178"
            rel="noopener"
            >Digital Box</a
          >
          <div id="paypal-button-container" class="card center" style="margin: 20px 0"></div>
        </div>
      </div>
    </header>

    <main id="main" role="main">
      <!-- (Inhalt unverändert) -->

      <section id="offer" class="section">

      </section>

        <!-- ... -->

      <section class="section" id="whats-inside">

      </section>
      <section id="faq" class="section section--border fade-in">

    <footer class="footer" role="contentinfo">
      <div class="wrap footer__inner">
        <nav class="footer__links" aria-label="Rechtliches">
          <a href="impressum.html">Impressum</a>
          <a href="datenschutz.html">Datenschutzerklärung</a>
        </nav>
        <div class="footer__social">
          <a href="https://www.instagram.com/themysterycode.de/" target="_blank" rel="noopener">
            <img
              src="image/icons/instagram.svg"
              alt="Instagram"
              loading="lazy"
              width="28"
              height="28"
            />
          </a>
        </div>
        <p class="footer__copy">© 2025 The Mystery Code – All rights reserved.</p>
      </div>
    </footer>

    <!-- PayPal SDK (Live) – WICHTIG: alles in EINER Zeile, kein Zeilenumbruch -->
    <script
      src="https://www.paypal.com/sdk/js?client-id=AbQMETbSymjnzm5EVEcEIjXX_8Pj1F2hUKIf-PRcLALG1c9cgpjHwhbew1kgL_k-udi9I0r8BdH01FpJ&currency=EUR&intent=capture&enable-funding=card,paylater"
      onload="window.initPayPal && window.initPayPal()"
      data-sdk-integration-source="button"
    ></script>
    <script src="js/offer.js" defer></script>
  </body>
</html>
